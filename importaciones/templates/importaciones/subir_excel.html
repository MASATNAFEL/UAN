{% extends "estudiantes/home.html" %}
{% load static %}
{% block title %}carga masivos - SGEIUAN{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Subir archivo Excel</h2>

    <form method="POST"
          enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label for="archivo" class="form-label">
                Selecciona tu archivo Excel
            </label>

            <input
                type="file"
                name="archivo"
                id="archivo"
                class="form-control"
                accept=".xlsx"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Subir archivo
        </button>
    </form>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} mt-3">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
</div>
{% endblock %}
