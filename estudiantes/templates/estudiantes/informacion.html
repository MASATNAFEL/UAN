<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>informacion estudiante</title>
</head>
<body>
  <h1>informacion estudiante</h1> 
  <table border="1">
    <thead>
      <tr>
        <th colspan="2">{{estudiante.nombre}}</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>tipo de cédula:</td>
        <td>{{ estudiante.tipocc }}</td>
      </tr>
      <tr>
        <td>cédula ciudadania:</td>
        <td>{{ estudiante.cedula_ciudadania }}</td>
      </tr>
       <tr>
        <td>Programa:</td>
        <td>{{ estudiante.programa }}</td>
      </tr>
       <tr>
        <td>Contacto:</td>
        <td>{{ estudiante.contacto }}</td>
      </tr>
    </tbody>
  </table> 
  
</body>
</html>
