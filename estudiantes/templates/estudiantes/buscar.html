<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="" method="GET">

    <div {% if tipo != "buscar" %}hidden{% endif %}>
        <label for="n">Nombre:</label>
        <input type="text"
               name="n"
               id="n"
               placeholder="Buscar Nombre..."
               value="{{ consulta_nombre }}">
    </div>

    <div {% if tipo != "buscar" %}hidden{% endif %}>
        <label for="c">Cedula:</label>
        <input type="text"
               name="c"
               id="c"
               placeholder="Buscar Cedula..."
               value="{{ consulta_cedula }}">
    </div>

    <div {% if tipo != "consultar" %}hidden{% endif %}>
        <label for="codcarpeta">CodCarpeta:</label>
        <input type="text"
               name="codcarpeta"
               id="codcarpeta"
               placeholder="Buscar CodCarpeta..."
               value="{{ consulta_codcarpeta }}">
    </div>

    <button type="submit">Buscar</button>

</form>
<hr>
<h3>Resultados:</h3>
    
    {% if datos %}
        <table border="1">
    <thead>
      <tr>
        {% for encabezado in encabezados %}        
        <th>{{encabezado}}</th>
        {% endfor %}
      </tr>
	
    </thead>
    <tbody>
            {% for fila in datos %}
           <tr>
            {% for dato in fila %} 
	        <td>{{ dato }}</td>
	
            {% endfor %}
           </tr>
            {% endfor %}
        </tbody>
        </table>
    {% else %}
        <p>No se encontraron resultados con los criterios ingresados.</p>
    {% endif %}
    
</body>
</html>
