{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SGEIUAN{% endblock %}</title>
    <!-- Bootstrap 5 CDN para diseño rápido y responsive -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'estudiantes/style.css' %}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de Navegación Superior Común -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index1' %}">
                <img id="icono" src="{% static 'estudiantes/images/icono.webp' %}" alt="ico"><i class="bi bi-gradient"></i> SGEIUAN
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-link">
                      
                        <a class="nav-link" href="{% url 'index' %}"><i class="bi bi-search"></i> Informacion Estudiantes</a>
                    </li>
                    <li class="nav-link">
                      
                        <a class="nav-link" href="{% url 'buscar' %}"><i class="bi bi-search"></i> Buscar Estudiantes</a>
                    </li>
                    <li class="nav-link">
                        
                        <a class="nav-link" href="{% url 'registro' %}"><i class="bi bi-person-plus"></i> Registro Estudiantes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal Dinámico -->
    <main class="container my-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de Página Común -->
    <footer class="bg-dark text-white-50 text-center py-3 mt-auto">
        <div class="container">
            <small>&copy; 2026 SGEIUAN - Gestión Escolar</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle (Para que funcionen menús desplegables y componentes) -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
