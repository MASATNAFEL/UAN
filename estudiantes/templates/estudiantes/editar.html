{% extends "estudiantes/home.html" %}
{% load static %}
{% block title %}Actualizar - SGEIUAN{% endblock %}
{% block content %}
    <div class='container' style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h2 class="text-warning mb-4">Actualizar información</h2>

            <form method="post">
                {% csrf_token %}

                <!-- imprime todos los campos del formulario automáticamente -->

                 {{form.as_p}}

                 <div class="d-flex justify-content-between">
                    <a href="javascript:history.back()" class="btn btyn-secondary">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btyn-primary">
                        Guardar cambios 
                    </button>
                 </div>
            </form>
        </div>
    </div>  
{% endblock %}
