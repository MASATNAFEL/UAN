<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="bg-light p-4"> 

    <div class='container' style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h2 class="text-warning mb-4">Actualizar información</h2>

            <form method="post">
                {% csrf_token %}

                <!-- imprime todos los campos del formulario automáticamente -->


                
                 {{form.as_p}}

                 <hr>

                 <div class="d-flex justify-content-between">
                    <a href="javascript:history.back()" class="btn btyn-secondary">
                        Cancelar
                    </a>
<hr>
                    <button type="submit" class="btn btyn-secondary">
                        Guardar cambios 
                    </button>
                 </div>
            </form>
        </div>
    </div>  


</body>
</html>
